# NeoForm setup (Minecraft decompile/recompile) is memory-hungry; keep this generous.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is left OFF during the port: it hides which task invalidated the build.
org.gradle.configuration-cache=false


## Environment Properties

# Parchment parameter-name mappings layered on official MojMap.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x targets Minecraft 1.21.1. GT 8.0.0 builds against 21.1.234; 21.1.248 is the
# latest stable and is what the WFLib / MCglTF / ywzj_vehicle ports already run on.
neo_version=21.1.248
neo_version_range=[21.1.1,22)
loader_version_range=[1,)


## Dependency Properties
# NOTE: gtceu / wflib / warforge / mcgltf / ywzj_vehicle are consumed as local jars from
# libs/ (built out of the sibling checkouts under ~/projects/wf2-21). Versions here are only used
# for the neoforge.mods.toml dependency ranges.

gtceu_version=8.0.0
gtceu_version_range=[8.0.0,)
wflib_version=1.1.6
warforge_version=2.4.3
ywzj_vehicle_version=0.5.8

# Pulled from GTCEu's maven — these are the artifacts GregTech 8.0.0 jar-in-jars, so they are
# compileOnly here and supplied at runtime by the GregTech jar itself.
registrate_version=MC1.21-1.3.0+67
configuration_version=3.1.1-neoforge
mui_version=3.3.1-SNAPSHOT

# Runtime-only deps of the sibling mods — see the note in build.gradle's dependencies block.
# Neither is used by wfcore's own code; both are needed for a dev launch to start.
flywheel_version=1.0.6
# Must track WarForge-Remaintained's gradle.properties `ldlibVersion`.
ldlib2_version=2.2.26

# Recipe viewer / integrations
jei_version=19.25.1.328
ae2_version=19.2.8
kubejs_version=2101.7.2-build.336
rhino_version=2101.2.7-build.81
embeddium_version=1.0.8-beta.367+mc1.21
iris_version=1.8.14-beta.1+1.21.1-neoforge
# TACZ — MUKSC's 1.21.1 fork (https://github.com/MUKSC/TACZ-1.21.1)
tacz_version=tacz-1-21-1-1353462:8547439

# Worldgen stack for the wf_worldgen datapack (worldgen-workspace/DESIGN.md layer 1). Runtime-only:
# wfcore's road code needs neither on its compile classpath, it only reads the pack's road network.
# lithostitched 1.7.13 is the build DESIGN.md verified `lithostitched:axis` against; 1.8.0 is beta.
lithostitched_version=1.7.13-neoforge-21.1
lithosphere_version=1.8.1+mod
# Simple Bedrock Model — jarJar'd by ywzj_vehicle (Limitless); compileOnly here.
simplebedrockmodel_version=2.5.1-neoforge-mc1.21.1


