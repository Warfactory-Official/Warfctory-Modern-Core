import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import net.neoforged.moddevgradle.legacyforge.dsl.ObfuscationExtension

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'com.gradleup.shadow' version '8.3.6'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_21
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}
legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    configurations.named("additionalRuntimeClasspath").configure {
        extendsFrom(configurations.shade)
    }


    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

}

// The dev-run manifest (src/main/resources/META-INF/MANIFEST.MF) declares MixinConfigs for exploded
// dev mods. In packaged jars the manifest is generated by the Jar task instead, so drop the copied
// source manifest to avoid a duplicate META-INF/MANIFEST.MF entry.
tasks.withType(Jar).configureEach {
    exclude 'META-INF/MANIFEST.MF'
}

jar {
    // The shaded + reobfuscated jar (shadowJar -> reobfShadowJar) is the published artifact and
    // takes the empty classifier. Move the plain jar (and its auto-created reobfJar) aside so the
    // two reobf outputs do not collide on build/libs/<name>.jar.
    archiveClassifier.set('slim')
    manifest.attributes([
            "MixinConfigs": "wfcore.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    shade("org.yaml:snakeyaml:2.2")
    shade("org.apache.commons:commons-math3:3.6.1")


    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")

    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modImplementation("curse.maven:modularui-624243:8118122")

    // KubeJS (research authoring). Compile-only: the modpack provides KubeJS + Rhino + Architectury at runtime.
    modCompileOnly("curse.maven:kubejs-238086:5853326") { transitive = false }
    modCompileOnly("curse.maven:rhino-416294:6186971") { transitive = false }

    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    modImplementation("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1") {
        exclude group: "org.spongepowered", module: "mixin"
    }

    // McGLTF (1.20.1 port) — drives the hand-authored animated machine models (radar dish). Ships its own
    // jgltf; mod-provided at runtime, so it is a normal modImplementation (no shading).
    modImplementation("curse.maven:${mcgltf_version}")

    // Embeddium (the modpack's Sodium implementation; keeps the me.jellysquid.mods.sodium packages, so it
    // also covers Rubidium). Compile-only target for the chunk-mask mixin — provided by the pack at
    // runtime; absent in dev, where Mixin silently skips EmbeddiumBlockRendererMixin and the vanilla path
    // takes over.
    modCompileOnly("maven.modrinth:embeddium:0.3.31+mc1.20.1") { transitive = false }

    modImplementation("curse.maven:superb-warfare-1218165:7292685") {
        exclude group: "org.spongepowered", module: "mixin"
    }

    // WarForge (research sharing + chunk reinforcer integration). Compile-only against the published
    // CurseForge jar; the modpack provides WarForge at runtime. transitive=false avoids dragging in
    // WarForge's own modularui/journeymap deps. Optional — integration is gated on the mod being loaded.
    modCompileOnly("curse.maven:${warforge_version}") { transitive = false }
}

tasks.named('shadowJar', ShadowJar).configure {
    configurations = [project.configurations.shade]
    archiveClassifier.set('')
    manifest.from(tasks.named('jar').get().manifest)

    relocate 'org.apache.commons.math3', 'wfcore.shadow.commons.math3'

    from(layout.buildDirectory.file("mixin/mixins.${mod_id}.refmap.json"))
}


def reobfShadowJar = extensions.getByType(ObfuscationExtension)
        .reobfuscate(tasks.named('shadowJar', ShadowJar), sourceSets.main)

tasks.named('assemble').configure {
    dependsOn(reobfShadowJar)
}
tasks.named('build').configure {
    dependsOn(reobfShadowJar)
}

mixin {
    // Only register the source set for refmap generation. We deliberately do NOT call `config(...)`:
    // that injects `--mixin.config` into dev runs, which registers the config against the bootstrap
    // Root Container before the mod's resources are on the classloader, so the file can't be read and
    // launch crashes. Instead the config is declared via the `MixinConfigs` manifest attribute (jar
    // task below + src/main/resources/META-INF/MANIFEST.MF for dev runs), which FML's Forge mixin
    // platform agent reads from the mod file at the right time — the same path the JAR deps use.
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(21)
    options.compilerArgs << "-Aquiet=true"
}