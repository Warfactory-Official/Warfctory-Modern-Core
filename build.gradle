import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import net.neoforged.moddevgradle.legacyforge.dsl.ObfuscationExtension

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.gradleup.shadow' version '8.3.6'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        // flywheel (runtime dep of the local wfballistics jar, which only jarJars it)
        name = "createmod maven"
        url = "https://maven.createmod.net/"
        content { includeGroup "dev.engine-room.flywheel" }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java {
    // Target Java 17 BYTECODE (class 61). The mod still runs on the Java 21 JVM; this only caps the
    // emitted class version so the bundled Mixin 0.8.5 (max CompatibilityLevel JAVA_18 = class 62) can
    // process our mixin classes. Compiling to Java 21 (class 65) makes every wfcore mixin fail to apply.
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}
legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    configurations.named("additionalRuntimeClasspath").configure {
        extendsFrom(configurations.shade)
    }



    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

}

// The dev-run manifest (src/main/resources/META-INF/MANIFEST.MF) declares MixinConfigs for exploded
// dev mods. In packaged jars the manifest is generated by the Jar task instead, so drop the copied
// source manifest to avoid a duplicate META-INF/MANIFEST.MF entry.
tasks.withType(Jar).configureEach {
    exclude 'META-INF/MANIFEST.MF'
}

jar {
    // The shaded + reobfuscated jar (shadowJar -> reobfShadowJar) is the published artifact and
    // takes the empty classifier. Move the plain jar (and its auto-created reobfJar) aside so the
    // two reobf outputs do not collide on build/libs/<name>.jar.
    archiveClassifier.set('slim')
    manifest.attributes([
            "MixinConfigs": "wfcore.mixins.json"
    ])
}

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    shade("org.apache.commons:commons-math3:3.6.1")


    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    modRuntimeOnly("curse.maven:jade-324717:5390389")

    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")
    modImplementation("curse.maven:modularui-624243:8339410")

    modCompileOnly("curse.maven:kubejs-238086:5853326") { transitive = false }
    modCompileOnly("curse.maven:rhino-416294:6186971") { transitive = false }

    modRuntimeOnly("curse.maven:kubejs-238086:5853326") { transitive = false }
    modRuntimeOnly("curse.maven:rhino-416294:6186971") { transitive = false }
    modRuntimeOnly("curse.maven:architectury-api-419699:5137938") { transitive = false }
    modRuntimeOnly("curse.maven:forgematica-912441:6438641")
    modRuntimeOnly("curse.maven:mafglib-910766:6763273")
    modCompileOnly("curse.maven:mafglib-910766:6763273") { transitive = false }

    modRuntimeOnly "curse.maven:gtceu-terminals-1423461:8275858"
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    modImplementation("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1") {
        exclude group: "org.spongepowered", module: "mixin"
    }

    modImplementation("com.modularmods:mcgltf:1.20.1")


    modCompileOnly("maven.modrinth:embeddium:0.3.31+mc1.20.1") { transitive = false }

    modImplementation("curse.maven:superb-warfare-1218165:8104849") {
        exclude group: "org.spongepowered", module: "mixin"
    }
    // Superb Warfare 0.8.9 was rewritten in Kotlin and now requires the Kotlin For Forge language provider
    // (>= 4.11.0 on 1.20.1). Provides the `kotlinforforge` FML language provider and the Kotlin stdlib that
    // SBW's compiled classes need at runtime. The modpack must ship KFF too. Not shaded into the WFCore jar.
    implementation("thedarkcolour:kotlinforforge:4.11.0")
    modCompileOnly("curse.maven:geckolib-388172:8285794") { transitive = false }
    modRuntimeOnly("curse.maven:geckolib-388172:8285794")

    modImplementation("curse.maven:${warforge_version}") { transitive = false }

    // WF-Ballistics: local jar in libs/ (flatDir resolves by filename, group is ignored - mcgltf pattern).
    // Rebuild from the sibling WF-Ballistics clone and recopy when it changes.
    modImplementation("com.wf:wfballistics:${wfballistics_version}")
    // wfballistics only jarJars flywheel; nested-jar extraction from a flatDir jar isn't reliable in dev,
    // so resolve it explicitly for the dev runtime. Drop this if runClient ever reports a duplicate.
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
}

tasks.named('shadowJar', ShadowJar).configure {
    configurations = [project.configurations.shade]
    archiveClassifier.set('')
    manifest.from(tasks.named('jar').get().manifest)

    relocate 'org.apache.commons.math3', 'wfcore.shadow.commons.math3'

    from(layout.buildDirectory.file("mixin/mixins.${mod_id}.refmap.json"))
}


def reobfShadowJar = extensions.getByType(ObfuscationExtension)
        .reobfuscate(tasks.named('shadowJar', ShadowJar), sourceSets.main)

tasks.named('assemble').configure {
    dependsOn(reobfShadowJar)
}
tasks.named('build').configure {
    dependsOn(reobfShadowJar)
}

mixin {
    // Only register the source set for refmap generation. We deliberately do NOT call `config(...)`:
    // that injects `--mixin.config` into dev runs, which registers the config against the bootstrap
    // Root Container before the mod's resources are on the classloader, so the file can't be read and
    // launch crashes. The packaged jar declares the config via the `MixinConfigs` manifest attribute
    // (jar task above); for dev runs see writeDevMixinManifest below.
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
}

// In dev runs the mod is an exploded directory whose FIRST classpath root is build/classes/java/main.
// FML reads a mod's JAR manifest (and thus the `MixinConfigs` attribute) from that primary root only —
// NOT from the resources output (build/resources/main) where processResources copies our MANIFEST.MF.
// Without this the mod's mixin config is never registered in dev (runClient/runData/runServer), so none
// of our mixins apply. Write the manifest into the classes root as part of compileJava's own action so
// the classes dir has a single owning task (a separate task writing there trips Gradle 8's overlapping-
// output validation against the run/IDE JavaExec tasks that read it).
tasks.named('compileJava', JavaCompile).configure {
    doLast {
        def f = destinationDirectory.file('META-INF/MANIFEST.MF').get().asFile
        f.parentFile.mkdirs()
        f.text = "Manifest-Version: 1.0\nMixinConfigs: wfcore.mixins.json\n"
    }
}

tasks.named('processResources', ProcessResources).configure {
    // src/main/resources (hand-authored, listed first) and src/generated/resources both contribute
    // assets/wfcore/lang/en_us.json. The hand-authored file is authoritative (GUI + tooltip strings);
    // EXCLUDE keeps it and drops any datagen-regenerated lang so a future runData can't break the build.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true"
}