plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // ModDevGradle 2 — NeoForge's own single-version build plugin. Replaces ForgeGradle +
    // MixinGradle: NeoForge bundles Mixin/MixinExtras and runs on MojMap, so there is no
    // reobf step and no refmap. The Forge-era `sourceCompatibility = 17` hack (needed only to
    // keep Mixin 0.8.5 happy) and the commons-math3 shadow-relocation are both gone with it.
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

sourceSets.main.java {
    // ---------------------------------------------------------------------------------------
    // PORT WORK QUEUE. Everything listed here is excluded from compilation for now; entries are
    // deleted from this list as each phase of WFCORE-PORT-PLAN.md lands. An empty list means the
    // port is code-complete.
    //
    // STATUS: phases 0, 2, 3 and 4 are done — the source set COMPILES CLEAN (623 -> 0 errors).
    // Landed so far: the NeoForge sweep across all non-GT code; GT 8.0.0 registration (WFMachines +
    // WfCoreAddon); the MetaMachineBlockEntity/MetaMachine merge (all 8 paired *BlockEntity classes
    // collapsed into their machines); FactoryBlockPattern -> MultiblockPatternBuilder across every
    // structure; LDLib syncdata -> GT sync_system; and the removed feature interfaces
    // (IUIMachine/IFancyUIMachine -> IMuiMachine, IMachineLife/IInteractedMachine -> MetaMachine hooks,
    // IFluidRenderMulti -> MultiblockFluidRendererTrait).
    //
    // Also landed, in the LDLib1 GUI -> ModularUI 3 rewrite (plan §2): PrinterMachine proved the pattern,
    // then CreativeComputationSink, Calibrator, CPU/RAM slot parts, LargeTransformer, Mainframe,
    // ChunkReinforcer, DrillRig, MissileFactory and Radar. Multiblock status readouts moved from
    // MultiblockDisplayText/ComponentPanelWidget to getWidgetsForDisplay + common/mui/WFMuiWidgets,
    // which is the wfcore counterpart to GTMultiblockTextUtil for the controllers that have no recipe
    // logic. NeoForge also moved getRenderBoundingBox from the block entity onto the renderer, so the
    // five wide-model machines now answer through IWideRenderBoundsMachine.
    //
    // Since then: the AC pipenet, the recipe conditions (8.0.0 made RECIPE_CONDITIONS an ordinary vanilla
    // registry, so the old unfreeze/borrow-GT's-mod-container hack is gone), WFRecipeTypes (recipe-type UI
    // via .UI(builder -> ...), FinishedRecipe -> RecipeOutput), the crafting-station crafter
    // (CraftingContainer -> CraftingInput, RecipeHolder, CommonHooks) and the whole long tail of 1.21
    // renames. Vein transplanting is stubbed with an explanation: 8.0.0 moved ore veins to a datapack
    // registry, so runtime re-registration is no longer possible and it needs rebuilding (its only caller,
    // GTOreLoaderTransplantMixin, is already on this queue).
    //
    // Finally the Crafting Station, the last LDLib1 GUI. Its three SlotWidget subclasses are gone:
    // ModularUI 3 runs slots through vanilla click semantics, so shift-click routing (tools to the bay,
    // then the player, then the store) is now just slot-group shift-click priorities, and craft-all is
    // the container's own quickMoveStack loop — no 1000-iteration cap, no hasRoomFor pre-check.
    // StorageGridWidget was rebuilt as a scroll widget with a custom layoutWidgets that packs matching
    // slots and parks the rest off-viewport; it must NOT filter by disabling slots, because MUI3 syncs
    // ItemSlot enabled state to the server and every empty slot fails a non-empty query, which would kill
    // shift-click into the store. StorageSlotWidget was not recreated — ignoreMaxStackSize(true) plus the
    // group priority is all it did. The JEI transfer handler now finds slots by group name instead of the
    // hardcoded menu indices it used to use, which is also what let it survive the switch to MUI3's
    // single shared ModularContainerMenu.
    //
    // !! LESSON, recorded here because it invalidated every error count in this comment's history: while
    // ANY compilation unit still has an unresolvable import, javac reports those and stops before
    // attributing method bodies — in every file. The "21 errors left" reading above was a lower bound;
    // clearing the last two dead LDLib imports exposed 54 real body-level errors in 26 untouched files.
    // Always re-baseline with `clean compileJava` after the last import error goes.
    //
    // DEFERRED source lives under deferred/ and is not on this source set at all
    // (see deferred/README.md and plan §3.2).
    //
    // Phase 7 — integrations against other mods' APIs (KubeJS, TACZ, WarForge, Ultimate Weight)
    // and the JEI/EMI recipe-viewer bridge.
    // WarForge is NOT excluded: the ported 2.4.3 jar is on the classpath, and the research gate,
    // mining explosion, nameplate and missile-launcher GUI all reach into it, so it has to come along
    // with the agnostic pass rather than wait for phase 7.
    // The JEI bridge is NOT excluded: jei-1.21.1-*-api is already a compileOnly dependency, and
    // ResearchTreeGui (which is on this source set) calls RecipeViewerBridge, so excluding it left a
    // compiled file referencing an uncompiled one.
    // PHASE 5 IS DONE for the 17 mixins that are on this source set: every @Mixin target, @Inject/@Redirect
    // method descriptor, @At target and @Shadow field was checked against the decompiled 1.21.1 sources.
    // Five were broken and are fixed — EditBox.moveCursorTo gained a select flag (I)V -> (IZ)V,
    // EntityRenderDispatcher.renderHitbox gained the three colour channels, EntityRenderer.renderNameTag
    // gained a partialTick (both handlers in NamePlateMixin), BrewingStandBlockEntity.isBrewable gained a
    // PotionBrewing parameter, and BlockRenderDispatcherMixin's descriptor still spelled ModelData
    // net/minecraftforge even though its Java import had been ported. None of these are caught by javac:
    // the descriptors are strings. wfcore.mixins.json sets required=true and defaultRequire=1, so each one
    // would have been a hard crash at startup rather than a silent no-op.
    //
    // PHASE 5b — FIRST RUNTIME LAUNCH. Compiling is not running; nothing here had ever been executed.
    // `runData` now completes (317 files: 67 blockstates, 89 item models, 71 block lang entries, no
    // warnings), and `runClient` reaches the title screen with wfcore's mixins confirmed APPLIED in the
    // transformer list (e.g. `pl:mixin:APP:wfcore.mixins.json:GuiDebugRemover`) — which is the runtime
    // proof the phase 5 descriptor audit could not give. Four real defects were found and fixed getting
    // there, none of them visible to javac:
    //   1. wflib hard-requires flywheel and warforge needs LDLib2 (it neither declares nor JiJs
    //      it) — both are now localRuntime. LDLib2's presence does NOT walk back plan §2: no wfcore
    //      class imports com.lowdragmc.*, it is there for warforge alone.
    //   2. NeoForge 21.1 throws on NeoForge.EVENT_BUS.register(obj) when obj has no @SubscribeEvent
    //      methods, where Forge silently accepted it. WFCore itself had none (its listeners are all
    //      lambdas on the mod bus), so `register(this)` was a hard startup crash. The other 15 game-bus
    //      listeners were audited and all carry instance @SubscribeEvent methods.
    //   3. WFItems.init() called GTItems.attach(...) during MOD CONSTRUCTION. The helper is a one-line
    //      lambda factory, but touching it forces GTItems.<clinit>, whose field initialisers build
    //      ItemMaterialInfos from GTMaterials constants — all still null that early, so it died on
    //      MaterialStack.material(). NEVER touch a GT content holder from a mod constructor.
    //
    // PHASE 5c — GREGTECH BLOCKERS CLEARED. Both blockers below were fixed in GregTech-Modern (branch
    // 1.21), along with five more defects of the same family that only became visible once each earlier
    // one was cleared. THE DEDICATED SERVER NOW STARTS: "Done (3.787s)!", world generated, and every
    // wfcore subsystem reports in (deposits 3 types, compute registries, block resistances, radar config).
    // runClient also boots with JEI back on the runtime classpath.
    //
    // First, GregTech-Modern's tree did not compile: 22 files carried the SAME comma-eating regex damage
    // recorded in the regex-sweep-oracle memory (javadoc ", {@code" -> " {@code", 2D array rows joined so
    // the separating comma vanished, and one deleted "implements"). None of it was intentional work, so
    // `git checkout -- .` restored it — the untouched source is the oracle.
    //
    // The seven GT fixes, all in dynamic recipe generation, all previously fatal to world loading because
    // they throw inside ReloadableServerResources#loadResources rather than skipping one recipe:
    //   1. MaterialRecipeHandler#generateSurfaceRockRecipe — the only material generator missing the
    //      material.shouldGenerateRecipesFor(prefix) guard, which is DEFINED as the empty-item check.
    //   2. CategoryIcon — resolved its JEI drawable in the constructor, from GTRecipeCategories' static
    //      init during RegisterEvent, when GTJEIPlugin.getRuntime() is still null. Now lazy.
    //   3. ChemicalHelper#getItems — called .get() on getItemFromTable(), which is null whenever
    //      doGenerateItem was satisfied by its first clause rather than by the item table.
    //   4. WireRecipeHandler — derived the cable prefix by string surgery through a registry lookup that
    //      can miss; the five cable prefixes are constants and are now passed explicitly.
    //   5/6. VanillaRecipeHelper + SimpleCookingRecipeBuilder — empty ItemStack ingredients and results
    //      now log and skip (isUnusableIngredient / isUnusableResult) instead of tripping the codecs.
    //   7. GTRecipeBuilder — chancedInput/chancedOutput(ItemStack,int) now mirror the empty check their
    //      String-fraction sibling already had, and outputItems null-guards its prefix.
    // Point fixes also replaced concrete ChemicalHelper.get(...) ingredients with MaterialEntry (tag)
    // ones in PipeRecipeHandler and WireRecipeHandler, so those recipes are RESTORED, not merely skipped.
    //
    // PHASE 5d — BOTH FOLLOW-UPS BELOW ARE NOW FIXED, and the second had one root cause behind it all.
    //
    // (A) THE BIG ONE: GTRegistries#actuallyRegister was discarding buffered registry entries.
    // GTRegistries.register() buffers into TO_REGISTER while isFrozen, and actuallyRegister replays it on
    // RegisterEvent. But RegisterEvent fires once PER REGISTRY and event.register(key, ...) only runs its
    // consumer when the key matches — while the old code cleared the ENTIRE buffer after the first event.
    // Every row whose own registry event had not fired yet was silently dropped. TagPrefix registers its
    // whole static initialiser's worth of prefixes that way, so TAG_PREFIXES ended up EMPTY (probe:
    // TAG_PREFIXES=0, MATERIALS=658). GTMaterialItems#generateMaterialItems iterates TAG_PREFIXES, so NOT
    // ONE material item — no dust, ingot, plate, wire, foil — was ever registered. That single bug caused
    // all of: 668 recipes skipped with "Tried to set output item stack that doesn't exist" (5 of them
    // wfcore's), an empty "GTCEu Material Items" creative tab, and TagPrefix.get(name) returning null for
    // prefixes that plainly exist (which is what broke WireRecipeHandler's cable lookup). Fixed by draining
    // only the row matching event.getRegistryKey() and clearing only what was drained:
    // TAG_PREFIXES 0 -> 95, skipped recipes 668 -> 0.
    //
    // (B) wfcore's creative tab crashed on world entry with "Itemstack 1 wfcore:aluminium_sheet_casing
    // already exists in the tab's list". Two independent mechanisms were filling one tab: GT's
    // RegistrateDisplayItemsGenerator (via .displayItems, keyed on GTRegistrate's TAB_LOOKUP) AND
    // Registrate's own listener — because defaultCreativeTab(...) also points defaultCreativeModeTab at the
    // new tab, and AbstractRegistrate#item then transforms every later builder with .tab(thatTab). Fixed in
    // WFCreativeTabs by switching Registrate's automatic assignment off (null) right after the tab is
    // built; see the comment there for why handing back CreativeModeTabs.SEARCH does NOT work.
    //
    // VERIFIED: runServer "Done (4.414s)!" with zero skipped-output errors, and a runClient booted straight
    // into a world (--quickPlaySingleplayer) joins with no crash, no wfcore tab warnings from JEI, and the
    // "GTCEu Material Items has no display items" warning gone. NOTE the remaining JEI warnings about
    // duplicates in 'GTCEu Decoration Blocks' / 'GTCEu Items' / 'Limitless Vehicle' — those tabs have the
    // same double-add as (B) but survive it as warnings rather than crashing, so GregTech has this bug too.
    //
    // Phase 7a: KubeJS integration ported and on the dev runtime. The bolt gun was never broken — it ships
    // no built-in conversions ("the pack owns the whole map"), so it stays inert until a startup script
    // registers one. run/kubejs/startup_scripts/wfcore_bolt_gun.js is the dev smoke test for that.
    //
    // Phase 7c: the work queue is EMPTY. wfweight + tacz came off it together — WeightGate moved to
    // Ultimate Weight's 1.21.1 views (the IPlayerWeightData capability is gone), the TACZ ballistics
    // adapter took the 1.21 RegistryFriendlyByteBuf / ItemStack.parse changes, and EntityKineticBulletAccessor
    // is back in its OWN mixin config (wfcore.tacz.mixins.json, required=false) because TACZ is optional and
    // wfcore.mixins.json's required=true would hard-crash without it. New: a TACZ loaded-ammo weight
    // provider replacing the deleted SBW launcher one, plus WFWeight/TaczWeights — Ultimate Weight keys on
    // item id, but every TACZ gun is tacz:modern_kinetic_gun and every round is tacz:ammo, so per-model
    // weights have to be resolved by TACZ id instead.
    //
    // Phase 7b: the 7 vehicle factories now spawn Limitless vehicles. Vehicles there are data-driven
    // BaseVehicleData entries, NOT entity types, so the EntityType axis through isDeployBlocked/isSpawnClear/
    // deploy was replaced with LimitlessVehicles (resolve, size, YwzjVehicleAPI.summon). WFVehicleBindings is
    // back with its SuperbOverrides half deleted; run/kubejs/server_scripts/wfcore_vehicle_factory.js is the
    // dev smoke test. Limitless ships 18 vehicles and none of them float, so the Naval Vehicle Deployer has
    // nothing to build until a pack adds a boat.
    //
    // Mixins whose targets are in mods not yet on the compile classpath, or GT classes that
    // moved in 8.0.0. Re-included alongside their subsystem; the live list is wfcore.mixins.json.
    // NOTE: EnderItemLinkCoverWeightMixin and MetaMachineCapabilityCacheMixin still carry
    // net/minecraftforge descriptors (IItemHandler, Capability, LazyOptional) and need the same treatment
    // when they come back on.
    exclude 'com/norwood/wfcore/mixin/BackpackStorageCellBlockMixin.java'
    exclude 'com/norwood/wfcore/mixin/DarknessConfigLockMixin.java'
    exclude 'com/norwood/wfcore/mixin/DataAccessHatchResearchShareMixin.java'
    exclude 'com/norwood/wfcore/mixin/EmbeddiumBlockRendererMixin.java'
    exclude 'com/norwood/wfcore/mixin/EnderItemLinkCoverWeightMixin.java'
    exclude 'com/norwood/wfcore/mixin/FireClayFluidPipeMixin.java'
    exclude 'com/norwood/wfcore/mixin/ForgeDebugTextRemover.java'
    exclude 'com/norwood/wfcore/mixin/GTOreLoaderTransplantMixin.java'
    exclude 'com/norwood/wfcore/mixin/IrisConfigShaderLockMixin.java'
    exclude 'com/norwood/wfcore/mixin/LongDistanceItemPipeWeightMixin.java'
    exclude 'com/norwood/wfcore/mixin/MEStorageMenuWirelessWithdrawMixin.java'
    exclude 'com/norwood/wfcore/mixin/MetaMachineCapabilityCacheMixin.java'
    exclude 'com/norwood/wfcore/mixin/MultiblockInfoSlotBoundsMixin.java'
    exclude 'com/norwood/wfcore/mixin/P2PItemTunnelWeightMixin.java'
    exclude 'com/norwood/wfcore/mixin/PatternPreviewWidgetNullSafeMixin.java'
    exclude 'com/norwood/wfcore/mixin/ProspectorOreDepositMixin.java'
    exclude 'com/norwood/wfcore/mixin/RenderablePngsManagerMixin.java'
    exclude 'com/norwood/wfcore/mixin/ServerLifecycleHooksMixin.java'
    exclude 'com/norwood/wfcore/mixin/WarforgeFobWarpGuardMixin.java'
    exclude 'com/norwood/wfcore/mixin/WarforgeNamePlateMixin.java'
    exclude 'com/norwood/wfcore/mixin/WFLibGasMaskMixin.java'
    // ---------------------------------------------------------------------------------------
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    // GTCEu's maven also hosts ModularUI 3 (brachy.modularui), which GregTech 8.0.0 jar-in-jars.
    maven { name = 'GTCEu Maven'; url = 'https://maven.gtceu.com' }
    maven { name = 'devos'; url = 'https://mvn.devos.one/snapshots/'; content { includeGroup 'com.tterrag.registrate' } }
    maven { name = 'toma'; url = 'https://repo.repsy.io/mvn/toma/public/'; content { includeGroup 'dev.toma.configuration' } }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei'; includeGroup 'org.embeddedt' } }
    maven { name = 'ModMaven'; url = 'https://modmaven.dev'; content { includeGroup 'org.appliedenergistics' } }
    maven { name = 'CreateMod'; url = 'https://maven.createmod.net'; content { includeGroup 'dev.engine-room.flywheel' } }
    maven { name = 'FirstDark'; url = 'https://maven.firstdark.dev/snapshots'; content { includeGroup 'com.lowdragmc.ldlib2' } }
    maven { name = 'FirstDark Releases'; url = 'https://maven.firstdark.dev/releases'; content { includeGroup 'com.lowdragmc.ldlib2' } }
    maven { name = 'Latvian'; url = 'https://maven.latvian.dev/releases'; content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' } }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven/'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'CurseMaven'; url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'JitPack'; url = 'https://jitpack.io'; content { includeGroupAndSubgroups 'com.github' } }
    flatDir { dirs 'libs' }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // No access transformers: the only entry in the Forge build widened
    // superbwarfare's VehicleEntity#setEnergy, and that whole layer is deleted (plan §4).
    // MDG auto-detects src/main/resources/META-INF/accesstransformer.cfg if one is added later.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Tip: add `programArguments.addAll '--quickPlaySingleplayer', '<save>'` to boot straight into a
            // world. Creative tab contents (and JEI's ingredient list) are only built on world entry, so a
            // title-screen launch cannot catch tab-population bugs.
        }
        client2 {
            client()
            ideName = 'runClient2'
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = project.file('run/client2')
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // `-PwfProfile` attaches Flight Recorder with allocation sampling on, for measuring worldgen cost.
            // Off by default: the allocation profile is not free, and it would skew the timings it reports.
            if (project.hasProperty('wfProfile')) {
                jvmArguments.addAll(
                        '-XX:StartFlightRecording=name=wfcore,settings=profile,' +
                                'filename=' + project.file('run/wfcore.jfr').absolutePath + ',dumponexit=true',
                        '-XX:FlightRecorderOptions=stackdepth=96',
                        '-Xlog:gc:file=' + project.file('run/wfcore-gc.log').absolutePath)
            }
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            programArguments.addAll '--existing-mod', 'gtceu'
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Dev-only runtime deps: on the runtime classpath for runClient/runServer, not published.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // --- GregTech CE Modern 8.0.0 -----------------------------------------------------------
    // Built locally out of ~/projects/wf2-21/GregTech-Modern (branch 1.21). The jar carries
    // Registrate / Configuration / ModularUI 3 as jar-in-jars, so it supplies them at runtime.
    compileOnly files('libs/gtceu-1.21.1-8.0.0.jar')
    localRuntime files('libs/gtceu-1.21.1-8.0.0.jar')

    // GregTech's public API leaks these types, so they must be on the compile classpath too.
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "dev.toma.configuration:configuration-1.21.1:${configuration_version}"
    // ModularUI 3 — the single UI stack for this port. LDLib is gone entirely (plan §2).
    compileOnly "brachy.modularui:modularui-mc1.21.1:${mui_version}"

    // --- Ported sibling mods (local jars) ----------------------------------------------------
    compileOnly files('libs/wflib-1.2.0.jar')
    localRuntime files('libs/wflib-1.2.0.jar')
    compileOnly files('libs/warforge-remaintained-2.4.3.jar')
    localRuntime files('libs/warforge-remaintained-2.4.3.jar')
    compileOnly files('libs/mcgltf-1.21.1.jar')
    localRuntime files('libs/mcgltf-1.21.1.jar')
    // Limitless Vehicle (ywzj_vehicle) — the vehicle-factory spawn target (plan §4).
    compileOnly files('libs/ywzj_vehicle-1.21.1-0.5.8.jar')
    localRuntime files('libs/ywzj_vehicle-1.21.1-0.5.8.jar')
    // Simple Bedrock Model — the packaged-vehicle item renderer draws Limitless' slot card with it.
    // compileOnly only: Limitless jar-in-jars it, so it is already there at runtime.
    compileOnly("com.github.mcmodderanchor:simplebedrockmodel:${simplebedrockmodel_version}") { transitive = false }

    // --- Dev-run-only deps of the sibling mods ----------------------------------------------
    // Neither of these is used by wfcore's own code; both are needed for a dev launch to get past
    // mod construction, because the sibling jars reach for them and supply them themselves.
    //
    // wflib declares flywheel as a REQUIRED dependency in its mods.toml.
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-1.21.1:${flywheel_version}"
    // warforge builds its GUIs on LDLib2 but neither declares it in mods.toml nor jar-in-jars it,
    // so it dies in mod construction with NoClassDefFoundError on LDLib2's BlockUIMenuType$BlockUI.
    // The ':all' classifier matches what WarForge-Remaintained compiles against — it shadows Yoga,
    // which plain ldlib2 >= 2.2.1 expects transitively.
    // NOTE: this puts LDLib2 on the dev runtime classpath. It does NOT walk back plan §2 — wfcore's
    // own UI is ModularUI 3 throughout and no wfcore class imports com.lowdragmc.*; LDLib2 is here
    // purely because a mod we depend on needs it.
    localRuntime "com.lowdragmc.ldlib2:ldlib2-neoforge-1.21.1:${ldlib2_version}:all"
    // KubeJS on the dev runtime (phase 7a) — wfcore's data-driven registries are populated only by its
    // bindings. 'rhino' is a separate required mod dep of KubeJS; transitive=false is safe as its other
    // two runtime deps are jar-in-jar'd. Plan §3.5's rhino clash was checked here and does not occur:
    // ywzj_vehicle's fork is shaded to org.mozillaa.* and is not a mod.
    localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    localRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }

    // --- Clustering (radar DBSCAN) -----------------------------------------------------------
    // Plain library, jar-in-jar'd. No shadow relocation needed on NeoForge.
    implementation 'org.apache.commons:commons-math3:3.6.1'
    jarJar(implementation('org.apache.commons:commons-math3:[3.6.1,4.0)') { version { prefer '3.6.1' } })

    // --- Recipe viewer -----------------------------------------------------------------------
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // --- Compile-only integrations (mixin targets / optional API surfaces) -------------------
    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    compileOnly("org.embeddedt:embeddium-1.21:${embeddium_version}") { transitive = false }
    compileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }
    // TACZ — MUKSC's 1.21.1 fork (plan §3.3). localRuntime too, so the weight compat can be verified.
    compileOnly("curse.maven:${tacz_version}") { transitive = false }
    localRuntime("curse.maven:${tacz_version}") { transitive = false }
    // Ultimate Weight. Built from ~/projects/wf2-21/Ultimate-Weight versions/1.21.1/neoforge.
    compileOnly files('libs/wfweight-1.21.1-NeoForge-1.0.0.jar')
    localRuntime files('libs/wfweight-1.21.1-NeoForge-1.0.0.jar')
    // wfweight reads its weight tables from YAML and shades snakeyaml only into its shadowJar; the dev
    // jar above does not carry it, so mod construction dies on NoClassDefFoundError without this.
    // additionalRuntimeClasspath, not localRuntime: the latter makes it a boot classpath module, which
    // the TRANSFORMER layer mods are loaded in cannot see.
    additionalRuntimeClasspath 'org.yaml:snakeyaml:2.6'

    // --- Worldgen stack ----------------------------------------------------------------------
    // Both are pure datapack engines with no API wfcore calls, so runtime-only. They are what makes
    // the wf_worldgen pack (see the copyWorldgenPack task below) produce its terrain.
    localRuntime("maven.modrinth:lithostitched:${lithostitched_version}") { transitive = false }
    localRuntime("maven.modrinth:lithosphere:${lithosphere_version}") { transitive = false }
}

/**
 * Stages the generated wf_worldgen datapack into the dev run directory, where WorldgenPackProvider
 * picks it up and offers it in the world-creation datapack list. Re-run after `build.py` regenerates
 * the pack; the run tasks depend on it, so a plain `runClient` is enough.
 *
 * Sync, not Copy: build.py emits fewer files when a feature is switched off, and a Copy would leave
 * the old json behind for the game to keep loading. That silently un-does the change.
 */
tasks.register('copyWorldgenPack', Sync) {
    group = 'wfcore'
    description = 'Stage worldgen-workspace/dist/wf_worldgen into run/ for the dev launches.'
    from rootProject.file('../worldgen-workspace/dist/wf_worldgen')
    into project.file('run/wf_worldgen')
    // The workspace is a sibling checkout, not a build input — do not fail a launch when it is absent.
    onlyIf { rootProject.file('../worldgen-workspace/dist/wf_worldgen').exists() }
}

tasks.matching { it.name in ['runClient', 'runClient2', 'runServer'] }.configureEach {
    dependsOn 'copyWorldgenPack'
}

// Expand ${...} tokens in src/main/templates (META-INF/neoforge.mods.toml) into the main source set.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            gtceu_version_range    : gtceu_version_range,
            wflib_version   : wflib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources).configure {
    // src/main/resources (hand-authored, authoritative) and src/generated/resources both contribute
    // assets/wfcore/lang/en_us.json. EXCLUDE keeps the first one seen.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    // During the port the error surface is the work queue — javac's default 100-error cap hides it.
    // TODO(port): drop once the tree compiles clean.
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
