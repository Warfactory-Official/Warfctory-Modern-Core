# This workflow builds the mod with Gradle on every push/PR to main, and on
# pushes to main it publishes a rolling "latest" GitHub release whose jar
# replaces the one from the previous build.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Only one release run per branch at a time; a newer push supersedes an in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/replace the release and move its tag

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # Pick the shaded + reobfuscated artifact (exclude the -slim and any -sources jars).
    - name: Locate published jar
      id: jar
      run: |
        JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-slim.jar' ! -name '*-sources.jar' | head -n1)
        if [ -z "$JAR" ]; then echo "::error::No publishable jar found in build/libs"; exit 1; fi
        echo "Found: $JAR"
        echo "path=$JAR" >> "$GITHUB_OUTPUT"

    # Rolling release: delete the previous "latest" release + tag (no-op on first run),
    # then recreate it pointing at this commit with the fresh jar. This guarantees the
    # new jar replaces the preceding one rather than accumulating assets.
    - name: Publish rolling "latest" release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest "${{ steps.jar.outputs.path }}" \
          --title "Latest build (${GITHUB_SHA::7})" \
          --notes "Automated build of \`main\` @ ${GITHUB_SHA}" \
          --latest
