name: Build 1.21.1

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
    branches: [ "1.21.1" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Await upstream snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # repo:workflow:branch. Upstream head run must pass before -SNAPSHOT deps resolve; 3 min grace for it to appear.
          for up in WfLib:nightly.yml:main Advanced-Hitbox-Framework:nightly.yml:main GemRender:nightly.yml:main CombinedAssault:nightly.yml:main; do
            IFS=: read -r repo wf branch <<<"$up"
            head=$(gh api "repos/Warfactory-Official/$repo/commits/$branch" -q .sha)
            status=; conclusion=; sha=; url=
            for i in $(seq 1 160); do
              IFS=$'\t' read -r sha status conclusion url < <(gh run list -R "Warfactory-Official/$repo" -w "$wf" -b "$branch" -L 1 \
                --json headSha,status,conclusion,url -q '.[0] | [.headSha, .status, .conclusion, .url] | @tsv') || true
              if [ "$status" = completed ] && { [ "$sha" = "$head" ] || [ "$i" -gt 12 ]; }; then break; fi
              sleep 15
            done
            [ "$status" = completed ] || { echo "::error::$repo $wf not finished after 40 min: $url"; exit 1; }
            [ "$conclusion" = success ] || { echo "::error::$repo $wf $conclusion at ${sha::7}: $url"; exit 1; }
            echo "$repo $wf ok at ${sha::7}"
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        continue-on-error: true  # org artifact quota full => still publish
        with:
          name: wfcore-1.21.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Tag != main's `latest`: that one carries the 1.20.1 jar.
      - name: Publish rolling latest-1.21.1 release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-1.21.1 --yes --cleanup-tag || true
          gh release create latest-1.21.1 build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Latest 1.21.1 build (${GITHUB_SHA::7})" \
            --notes "Automated NeoForge 1.21.1 build of ${GITHUB_SHA}" \
            --latest=false
