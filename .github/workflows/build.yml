name: Build 1.21.1

on:
  push:
    branches: [ "1.21.1" ]
  pull_request:
    branches: [ "1.21.1" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wfcore-1.21.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Tag != main's `latest`: that one carries the 1.20.1 jar.
      - name: Publish rolling latest-1.21.1 release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-1.21.1 --yes --cleanup-tag || true
          gh release create latest-1.21.1 build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Latest 1.21.1 build (${GITHUB_SHA::7})" \
            --notes "Automated NeoForge 1.21.1 build of ${GITHUB_SHA}" \
            --latest=false
